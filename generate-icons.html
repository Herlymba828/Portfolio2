<!DOCTYPE html>
<html>
<head>
    <title>Générateur d'Icônes PWA</title>
</head>
<body>
    <h1>Générateur d'Icônes PWA</h1>
    <canvas id="canvas" width="512" height="512" style="border: 1px solid #ccc;"></canvas>
    <br><br>
    <button onclick="generateIcon()">Générer Icône</button>
    <button onclick="downloadIcon()">Télécharger PNG</button>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        function generateIcon() {
            // Clear canvas
            ctx.clearRect(0, 0, 512, 512);
            
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, 512, 512);
            gradient.addColorStop(0, '#7c3aed');
            gradient.addColorStop(1, '#06b6d4');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 512, 512);
            
            // Add text "HCM"
            ctx.fillStyle = 'white';
            ctx.font = 'bold 120px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('HCM', 256, 256);
            
            // Add border
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 4;
            ctx.strokeRect(2, 2, 508, 508);
        }
        
        function downloadIcon() {
            const link = document.createElement('a');
            link.download = 'icon-512.png';
            link.href = canvas.toDataURL();
            link.click();
        }
        
        // Generate icon on load
        generateIcon();
    </script>
</body>
</html>
