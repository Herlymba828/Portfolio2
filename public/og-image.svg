<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050816;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="particle1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="particle2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Background effects -->
  <ellipse cx="180" cy="150" rx="80" ry="60" fill="url(#particle1)" opacity="0.3"/>
  <ellipse cx="1020" cy="480" rx="100" ry="80" fill="url(#particle2)" opacity="0.25"/>
  <ellipse cx="600" cy="400" rx="60" ry="40" fill="url(#particle1)" opacity="0.15"/>
  
  <!-- Decorative particles -->
  <circle cx="120" cy="120" r="3" fill="#7c3aed" opacity="0.7"/>
  <circle cx="1080" cy="510" r="4" fill="#06b6d4" opacity="0.6"/>
  <circle cx="220" cy="520" r="2" fill="#3b82f6" opacity="0.8"/>
  <circle cx="980" cy="140" r="3" fill="#7c3aed" opacity="0.5"/>
  <circle cx="80" cy="300" r="2" fill="#06b6d4" opacity="0.6"/>
  <circle cx="1120" cy="280" r="2" fill="#3b82f6" opacity="0.7"/>
  
  <!-- Main content -->
  <text x="600" y="180" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="700" fill="url(#textGradient)" filter="url(#glow)">
    HERLY CHARMAND MAMBOUNDOU
  </text>
  
  <text x="600" y="250" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="400" fill="#94a3b8">
    Développeur Fullstack • DevOps • Systèmes Distribués
  </text>
  
  <text x="600" y="320" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="300" fill="#64748b">
    Plateformes web, mobiles et infrastructures modernes
  </text>
  
  <text x="600" y="350" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="300" fill="#64748b">
    Performance • Scalabilité • Automatisation
  </text>
  
  <!-- Location -->
  <text x="600" y="420" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#a855f7">
    📍 Libreville, Gabon
  </text>
  
  <!-- Tech stack badges -->
  <rect x="320" y="470" width="90" height="35" rx="17" fill="rgba(124, 58, 237, 0.15)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="365" y="492" text-anchor="middle" font-family="JetBrains Mono, Courier, monospace" font-size="13" font-weight="500" fill="#a855f7">NestJS</text>
  
  <rect x="420" y="470" width="90" height="35" rx="17" fill="rgba(59, 130, 246, 0.15)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="465" y="492" text-anchor="middle" font-family="JetBrains Mono, Courier, monospace" font-size="13" font-weight="500" fill="#60a5fa">Django</text>
  
  <rect x="520" y="470" width="80" height="35" rx="17" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="560" y="492" text-anchor="middle" font-family="JetBrains Mono, Courier, monospace" font-size="13" font-weight="500" fill="#22d3ee">React</text>
  
  <rect x="610" y="470" width="90" height="35" rx="17" fill="rgba(124, 58, 237, 0.15)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="655" y="492" text-anchor="middle" font-family="JetBrains Mono, Courier, monospace" font-size="13" font-weight="500" fill="#a855f7">Docker</text>
  
  <rect x="710" y="470" width="110" height="35" rx="17" fill="rgba(59, 130, 246, 0.15)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="765" y="492" text-anchor="middle" font-family="JetBrains Mono, Courier, monospace" font-size="13" font-weight="500" fill="#60a5fa">PostgreSQL</text>
</svg>